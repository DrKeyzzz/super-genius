<!doctype html><html lang="en"><meta charset="utf-8"><title>Super Genius · native integration checks</title><style>body{background:#0b1523;color:#dce8f6;font:14px system-ui;padding:30px}button{padding:12px 25px}#frames{display:flex;flex-wrap:wrap}iframe{width:380px;height:230px}li{padding:3px}.pass{color:#93e7b9}.fail{color:#ff9b92}</style><h1>Native challenge integration checks</h1><p>Runs each channel at all three tiers. Native answer handlers must report correct answers; silent Rooftop runs must fail. Disposable component storage, no cloud writes.</p><button id="run">Run 60 checks</button><p id="status">Ready.</p><ol id="results"></ol><div id="frames"></div><script src="../catalog.js"></script><script>
const queue=GeniusCatalog.tiers.flatMap((_,tier)=>GeniusCatalog.catalog.map(c=>({c,tier})));const filter=new URLSearchParams(location.search).get('engines');if(filter){const keep=new Set(filter.split(','));for(let i=queue.length-1;i>=0;i--)if(!keep.has(queue[i].c.game))queue.splice(i,1);document.getElementById('run').textContent='Run '+queue.length+' checks'}let running=0,passed=0,failed=0,started=false;const tests=new Map();
function next(){while(running<4&&queue.length){const {c,tier}=queue.shift(),f=document.createElement('iframe');f.title=c.name;const row=document.createElement('li');row.textContent=c.name+' / '+c.label+' / Tier '+(tier+1)+' …';document.getElementById('results').append(row);const t={f,c,tier,row,token:crypto.randomUUID(),ended:false};tests.set(f,t);running++;f.src='../channels/'+c.engine+'.html?component-check=1&kind='+c.kind;document.getElementById('frames').append(f);t.timeout=setTimeout(()=>finish(t,false,'Timed out'),35000)}document.getElementById('status').textContent=`${passed} passed · ${failed} failed · ${running} running · ${queue.length} queued`}
function finish(t,ok,reason=''){if(t.ended)return;t.ended=true;clearTimeout(t.timeout);t.row.className=ok?'pass':'fail';t.row.textContent=t.row.textContent.replace(' …','')+' · '+(ok?'PASS':'FAIL')+' '+reason;t.f.remove();tests.delete(t.f);running--;if(ok)passed++;else failed++;next()}
addEventListener('message',e=>{const t=[...tests.values()].find(t=>t.f.contentWindow===e.source);if(!t||e.origin!==location.origin)return;const d=e.data;if(d.nativeCheckError){finish(t,false,d.nativeCheckError);return}if(!d.superGenius)return;if(d.type==='boot')t.f.contentWindow.postMessage({configureSuper:true,config:GeniusCatalog.config(t.c,t.tier,t.token)},location.origin);if(d.type==='ready')t.f.contentDocument.querySelector('#super-gate button').click();if(d.type==='error')finish(t,false,d.message);if(d.type==='result')finish(t,t.c.game==='roof'?!d.ok:d.ok,d.detail||'')});
document.getElementById('run').onclick=()=>{if(started)return;started=true;document.getElementById('run').disabled=true;next()};
</script></html>
